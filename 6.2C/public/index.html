<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SIT725 Calculator</title>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="container">
        <h1>Simple Calculator</h1>
        
        <input type="text" id="num1" placeholder="Enter Number 1">
        <input type="text" id="num2" placeholder="Enter Number 2">
        
        <button onclick="addNumbers()">Calculate Sum</button>
        
        <input type="text" id="result" placeholder="Result" readonly>
    </div>

    <script>
        function addNumbers() {
            
            var number1 = document.getElementById("num1").value;
            var number2 = document.getElementById("num2").value;

            
            fetch("/addTwoNumbers?n1=" + number1 + "&n2=" + number2)
                .then(response => response.json())
                .then(data => {
                    
                    if(data.statusCode === 200){
                        document.getElementById("result").value = data.data;
                    } else {
                        
                        alert(data.message);
                        document.getElementById("result").value = "Error";
                    }
                })
                .catch(err => {
                    console.error("Error:", err);
                });
        }
    </script>

</body>
</html>
