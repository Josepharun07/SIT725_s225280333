<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Simple Calculator for SIT725 2.2P</title>
</head>
<body>

    <h1>Calculator</h1>
    
    <input type="text" id="num1" placeholder="Number 1">
    <input type="text" id="num2" placeholder="Number 2">
    
    <button onclick="addNumbers()">Add</button>
    
    <input type="text" id="result" placeholder="Result" readonly>

    <script>
        function addNumbers() {
            // 1. Get the values from the two text boxes
            var number1 = document.getElementById("num1").value;
            var number2 = document.getElementById("num2").value;

            // 2. Call the server endpoint
            fetch("/addTwoNumbers?n1=" + number1 + "&n2=" + number2)
                .then(response => response.json())
                .then(data => {
                    // 3. Put the result into the result text box
                    document.getElementById("result").value = data.data;
                });
        }
    </script>

</body>
</html>
